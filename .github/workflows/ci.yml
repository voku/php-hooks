name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '7.1'
          - '7.2'
          - '7.3'
          - '7.4'
          - '8.0'
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'

    steps:
      - uses: actions/checkout@v6.1.0

      - uses: shivammathur/setup-php@2.37.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Exclude unsupported PHPStan from PHP 7.1 test installs
        if: matrix.php == '7.1'
        run: composer remove --dev --no-update --no-interaction phpstan/phpstan

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Audit dependencies, including development tools
        run: |
          if composer audit --help >/dev/null 2>&1; then
            composer audit
          else
            echo '::notice::Composer audit unavailable on this legacy PHP version; modern PHP matrix jobs run the audit.'
          fi

      - name: Run PHPUnit
        run: composer test

      - name: Run PHPStan
        if: matrix.php == '8.5'
        run: composer phpstan

  lowest-dependencies:
    name: Lowest dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.1.0

      - uses: shivammathur/setup-php@2.37.0
        with:
          php-version: '7.1'
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Exclude unsupported PHPStan from PHP 7.1 lowest install
        run: composer remove --dev --no-update --no-interaction phpstan/phpstan

      - name: Install lowest supported dependencies
        run: composer update --prefer-lowest --prefer-dist --no-interaction --no-progress

      - name: Audit dependencies, including development tools
        run: |
          if composer audit --help >/dev/null 2>&1; then
            composer audit
          else
            echo '::notice::Composer audit unavailable on this legacy PHP version; modern PHP matrix jobs run the audit.'
          fi

      - name: Run PHPUnit
        run: composer test
